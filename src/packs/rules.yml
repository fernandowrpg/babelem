            <p><strong>Grade:</strong> The Threat Grade can range from 0 to 3, and represents how dangerous this Threat is to the world and to everyone around it. Besides the GRADE, the Weaver can add an archetype to the Threat, between BOSS or MINION.</p>
            <p><strong>Threat Tests:</strong> Threats do not make Tests like protagonists for their actions and maneuvers. Instead, for rolls of basic attacks, Techniques or Spells, they count a number of Hits equal to their GRADE + current DANGER, while to Overcome they must spend 1 DEFENSE to obtain a Hit. When a Threat needs to test something, it will use a number of dice equal to its DANGER, treating any 1, 5 or 6 as a Hit.</p>
            <p><strong>Advantages and Disadvantages:</strong> When Threats receive advantage or disadvantage on attacks against a target, add dice to the protagonist's defense Test in the case of the Threat's disadvantage, or subtract dice from the protagonist's defense Test in the case of the Threat's advantage.</p>
            <p><strong>Reserve Expenditures:</strong> If a Threat needs to consume a Reserve, it will consume DANGER for offensive situations or DEFENSE for defensive situations. The final choice is up to the Weaver.</p>
            <p><strong>Threat Guard:</strong> When a Threat reaches 0 Guard, it is immediately defeated if it has no DEFENSE points. Otherwise, it must immediately spend all of its DEFENSE, rolling 1d6 for each point spent, and recover that value in its Guard. From that moment on, it becomes exposed.</p>
            <h2>Archetypes</h2>
            <p><strong>Boss:</strong> Has extra turns during the round. A GRADE 1 to 2 Boss has one additional turn. A GRADE 3 one has two additional turns. A BOSS Threat of grade "x" is equivalent to three normal Threats of the same grade.</p>
            <p><strong>Minion:</strong> Has only 1 Guard and 0 Defense, but they usually do not come alone, and they keep on coming. Besides placing them in the scene, specify a spawn point, from which new enemies can come until some condition is met for their reinforcements to cease. Three grade 1 MINION Threats are equivalent to 1 normal grade 1 Threat. Minions of the same type share a single turn, where each action represents all the Minions present.</p>
            <ul>
            <li><strong>Group Attack [Minions]:</strong> Make a DANGER Test, with +1d for each Minion beyond the first. Deal damage equal to the number of Hits + DANGER to one target, or 1 PD damage per Hit to different targets (one target for each Hit).</li>
            <li><strong>Create Obstacle [Minions]:</strong> Make a DANGER Test, with +1d for each Minion beyond the first. If you have at least one Hit, inflict a minor condition on a target within range.</li>
            <li><strong>Move Minions [Maneuver]:</strong> Place all Minions In or Out of the Brawl.</li>
            <li><strong>Sacrifice [Reaction]:</strong> Sacrifice a Minion to pay for a Reserve expenditure of another Threat.</li>
            </ul>
            <h2>Improvising Threats</h2>
            <p>To improvise a Threat, use the following table. You can lower the category of one item to raise another freely.</p>
            <table>
            <thead><tr><th></th><th>Mundane (Grade 0)</th><th>Dissonant (Grade 1)</th><th>Resonant (Grade 2)</th><th>Harmonic (Grade 3)</th><th>Special Grade</th></tr></thead>
            <tbody>
            <tr><th>GUARD</th><td>6</td><td>12</td><td>18</td><td>24</td><td>32</td></tr>
            <tr><th>DANGER</th><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr>
            <tr><th>DEFENSE</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr>
            </tbody>
            </table>
            <h2>Basic Threat Attacks</h2>
            <p>Consider DANGER as the number of Hits of Basic Threat Attacks, for the purpose of the players' defenses:</p>
            <ul>
            <li><strong>FIERCE Attack:</strong> Damage equal to [GRADE]d6k1 + current DANGER.</li>
            <li><strong>SWIFT Attack:</strong> Damage equal to GRADE + DANGER. After the damage is applied, it deals 1 extra PD damage if you obtained one Hit or fewer when defending.</li>
            <li><strong>SAVVY Attack:</strong> Make a SAVVY Contest. The side that wins the Test chooses a price to be paid by the loser.</li>
            </ul>
            <h2>Suggestions</h2>
            <p><strong>Powers:</strong> kidnaps a target; consumes a target's memory; consumes a target's Aura; redistribution of Attribute or Reserve; infects a target; feeds on a target.</p>
            <p><strong>Weaknesses:</strong> an element such as bright light, fire, coarse salt or running water; the remains must be purified; its true name.</p>
