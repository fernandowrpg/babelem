      pt: Enquanto estiver em um hospedeiro, todo dano dirigido ao Encosto é transferido ao hospedeiro.
      en: While in a host, all damage directed at the Haunt is transferred to the host.
    power:
      pt: >-
        O encosto não controla o hospedeiro, porém influencia seus pensamentos e decisões de forma sutil, passando
