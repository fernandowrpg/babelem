      en: >-
        The haunt does not control the host, but it subtly influences their thoughts and decisions, going
        unnoticed for long periods, feeding on the host's energy.
    weakness:
      pt: >-
        Como um parasita, o encosto precisa de um hospedeiro para sobreviver. Caso o hospedeiro seja morto ou consigam uma
        forma de removê-lo do hospedeiro, o encosto não consegue manter forma física, retornando ao Oblivo até encontrar
        outro hospedeiro.
      en: >-
        Like a parasite, the haunt needs a host to survive. If the host is killed or a way is found to
        remove it from the host, the haunt cannot maintain a physical form, returning to Oblivo until it finds
        another host.
