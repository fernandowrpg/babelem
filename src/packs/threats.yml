pack: threats
type: Actor
label:
  pt: Ameaças
  en: Threats
folders:
  - key: litura
    name:
      pt: Ecos de Litura
      en: Echoes of Litura
  - key: oblivo
    name:
      pt: Ecos de Oblivo
      en: Echoes of Oblivo
  - key: babelem
    name:
      pt: Ameaças de Babelém
      en: Threats of Babelém
entries:
  - key: pesadelo
    folder: litura
    origin: litura
    grade: 1
    guard: 12
    danger: 3
    defense: 1
    resistances: [void]
    name:
      pt: Pesadelo
      en: Nightmare
    interactionsPerTurn:
      pt: Uma Ação e uma Manobra durante seu turno.
      en: One Action and one Maneuver during its turn.
    tactics:
      pt: "Manobras favoritas: Mover-se, Levantar a Guarda, Atrapalhar. Reação disponível: contra-ataque, Induzir Pesadelo (Feitiço / Custa 1 TRAMA)."
      en: "Favorite maneuvers: Move, Raise Guard, Hinder. Available reaction: counterattack, Induce Nightmare (Spell / Costs 1 WEAVE)."
    power:
      pt: >-
        O Pesadelo atiça os maiores medos de seu alvo. Sempre que causar dano a alguém ou sofrer com o dano de alguém, o
        Pesadelo rouba uma memória do alvo, relacionada ao seu maior medo. O alvo perde 1 de MEMÓRIA.
      en: >-
        The Nightmare stokes its target's greatest fears. Whenever it deals damage to someone or suffers damage from
        someone, the Nightmare steals a memory from the target, related to their greatest fear. The target loses 1 MEMORY.
    weakness:
      pt: >-
        Sua fome pode ser sua sina. Atrair um pesadelo usando o medo de alguém é tão fácil quanto oferecer comida a um
        cão.
      en: >-
        Its hunger can be its undoing. Luring a nightmare using someone's fear is as easy as offering food to a
        dog.
    interactions:
      - key: drenar
        kind: action
        attack: brabo
        range: long
        cost: { value: 1, resource: danger }
        damage: "1d6 + @danger"
        damageType: void
        name:
          pt: Drenar
          en: Drain
        description:
          pt: >-
            Dano: 1d6 + PERIGO de dano Vazio, negado por BRABO. O alvo perde 1 de DEFESA. Recupera pontos de Guarda
            equivalentes à Memória faltando do alvo.
          en: >-
            Damage: 1d6 + DANGER void damage, negated by FIERCE. The target loses 1 DEFENSE. Recovers Guard points
            equal to the target's missing Memory.
      - key: atropelar
        kind: action
        attack: ligeiro
        range: short
        damage: "1 + @danger"
        damageType: kinetic
        name:
          pt: Atropelar
          en: Run Over
        description:
          pt: >-
            Dano: 1 + PERIGO atual de dano cinético, negado por LIGEIRO. +1 de dano AD. O alvo fica desequilibrado caso
            tenha apenas dois Acertos ou menos ao defender-se.
          en: >-
            Damage: 1 + current DANGER kinetic damage, negated by SWIFT. +1 PD damage. The target is left off-balance if
            they have only two Hits or fewer when defending.
      - key: amedrontar
        kind: action
        attack: safo
        range: wide
        cost: { value: 1, resource: weave }
        name:
          pt: Amedrontar
          en: Terrify
        description:
          pt: Todos os oponentes sofrem 2 de dano vazio AD ou devem mover-se para longe do Pesadelo, ficando exaustos.
          en: All opponents suffer 2 void PD damage or must move away from the Nightmare, becoming exhausted.

  - key: candeeiro
    folder: litura
    origin: litura
    grade: 1
    guard: 12
    danger: 3
    defense: 1
    resistances: [energy]
    name:
      pt: Candeeiro
      en: Lantern (Candeeiro)
    interactionsPerTurn:
      pt: Uma Ação e uma Manobra durante seu turno.
      en: One Action and one Maneuver during its turn.
    tactics:
      pt: "Manobras favoritas: Mover-se, Levantar a Guarda, Canalizar. Reação disponível: contra-ataque, Clarão Solar (Feitiço, Custa 1 TRAMA)."
      en: "Favorite maneuvers: Move, Raise Guard, Channel. Available reaction: counterattack, Solar Flash (Spell, Costs 1 WEAVE)."
    power:
      pt: >-
        O Candeeiro queima e encanta, chama pra dançar. Sempre que dança, no entanto, deixa suas brasas escaparem,
        iniciando um incêndio que pode espalhar-se rapidamente.
      en: >-
        The Lantern burns and enchants, beckoning you to dance. Whenever it dances, however, it lets its embers escape,
        starting a fire that can spread quickly.
    weakness:
      pt: >-
        O Candeeiro só existe enquanto puder queimar. Caso consigam privá-lo de combustível, ele relegará-se ao estado de
        meras cinzas, calmo e dócil.
      en: >-
        The Lantern only exists as long as it can burn. If it is deprived of fuel, it will be reduced to a state of
        mere ashes, calm and docile.
    interactions:
      - key: flecha-flamejante
        kind: action
        attack: brabo
        range: long
        cost: { value: 1, resource: weave }
        name:
          pt: Flecha Flamejante (Feitiço)
          en: Flaming Arrow (Spell)
        description:
          pt: Custa 1 TRAMA ou Canalização.
          en: Costs 1 WEAVE or Channeling.
      - key: erupcao
        kind: action
        name:
          pt: Erupção (Feitiço)
          en: Eruption (Spell)
        description:
          pt: A Tecelã paga TRAMA no lugar de Aura para os efeitos deste feitiço.
          en: The Weaver pays WEAVE in place of Aura for the effects of this spell.
      - key: queimar
        kind: action
        cost: { value: 2, resource: weave }
        name:
          pt: Queimar (Feitiço)
          en: Burn (Spell)
        description:
          pt: Requer 2 TRAMA.
          en: Requires 2 WEAVE.
      - key: hipnose-ignea
        kind: action
        attack: safo
        range: wide
        cost: { value: 1, resource: danger }
        name:
          pt: Hipnose Ígnea
          en: Fiery Hypnosis
        description:
          pt: >-
            Um alvo no alcance aproxima-se do Candeeiro, sofrendo 2 de dano energético AD caso já estivesse próximo, ou
            fica impedido de mover-se até o final de seu próximo turno.
          en: >-
            A target within range moves toward the Lantern, suffering 2 energy PD damage if it was already close, or
            is impeded from moving until the end of its next turn.

  - key: sombra
    folder: litura
    origin: litura
    grade: 1
    guard: 12
    danger: 3
    defense: 1
    name:
      pt: Sombra
      en: Shadow
    interactionsPerTurn:
      pt: Uma Ação e uma Manobra durante seu turno.
      en: One Action and one Maneuver during its turn.
    special:
      pt: >-
        GUARDA e PERIGO iguais aos do Anteparo. Quando uma Sombra surgir em cena, ela deriva a partir da sombra de um
        alvo, chamado de Anteparo. Escolha um outro personagem em cena (pode ser aliado, inimigo ou independente). A sombra
        assume uma forma similar ao alvo, como se fosse uma imagem em tons de cinza do mesmo. Caso o Anteparo tenha 3 ou
        mais de BRABO, receba um Acerto em todo ataque brabo realizado. Caso o Anteparo tenha 3 ou mais de LIGEIRO,
        receba +2d em todo ataque ligeiro realizado.
      en: >-
        GUARD and DANGER equal to those of the Screen. When a Shadow appears in a scene, it derives from the shadow of a
        target, called the Screen. Choose another character in the scene (an ally, enemy or independent). The shadow
        takes on a form similar to the target, as if it were a grayscale image of them. If the Screen has 3 or more
        FIERCE, receive a Hit on every FIERCE attack made. If the Screen has 3 or more SWIFT, receive +2d on every
        SWIFT attack made.
    tactics:
      pt: "Manobras favoritas: Mover-se, Atrapalhar, Plágio. Reação disponível: contra-ataque, bloquear, Cópia (Feitiço, Custa 1 TRAMA)."
      en: "Favorite maneuvers: Move, Hinder, Plagiarize. Available reaction: counterattack, block, Copy (Spell, Costs 1 WEAVE)."
    power:
      pt: >-
        A Sombra imita seu alvo muito bem até ser revelada, podendo enganar até a si mesma, tomando o lugar de seu
        Anteparo até que tenha sua natureza revelada ou escolha outro alvo.
      en: >-
        The Shadow imitates its target very well until revealed, able to fool even itself, taking the place of its
        Screen until its nature is revealed or it chooses another target.
    weakness:
      pt: >-
        A ligação da Sombra ao Anteparo é efêmera caso sua natureza seja revelada. Caso o anteparo seja derrotado ou seja
        removido de cena por algum motivo, a Sombra tentará recuar da forma mais imediata possível.
      en: >-
        The Shadow's bond to the Screen is fleeting if its nature is revealed. If the screen is defeated or is
        removed from the scene for any reason, the Shadow will try to retreat as immediately as possible.
    interactions:
      - key: assumir-brabo
        kind: action
        attack: brabo
        range: wide
        damage: "3 + @danger"
        damageType: void
        name:
          pt: Assumir (ataque brabo)
          en: Assume (FIERCE attack)
        description:
          pt: >-
            Dano: 3 + PERIGO de dano Vazio, negado por SAFO, e o alvo perde 1 de Defesa caso tenha apenas um Acerto ou
            menos ao defender-se. Causa +1d6 de dano caso o alvo seja o Anteparo.
          en: >-
            Damage: 3 + DANGER void damage, negated by SAVVY, and the target loses 1 Defense if they have only one Hit or
            fewer when defending. Deals +1d6 damage if the target is the Screen.
      - key: assumir-ligeiro
        kind: action
        attack: ligeiro
        range: wide
        damage: "1d6"
        damageType: void
        name:
          pt: Assumir (ataque ligeiro)
          en: Assume (SWIFT attack)
        description:
          pt: >-
            Dano: 1d6 de dano Vazio, negado por SAFO, +1 de dano AD caso tenha apenas um Acerto ou menos ao defender-se.
            Causa +1d6 de dano caso o alvo seja o Anteparo.
          en: >-
            Damage: 1d6 void damage, negated by SAVVY, +1 PD damage if they have only one Hit or fewer when defending.
            Deals +1d6 damage if the target is the Screen.
      - key: plagio
        kind: maneuver
        range: wide
        name:
          pt: Plágio
          en: Plagiarize
        description:
          pt: Copia um traço, feitiço ou técnica do Anteparo.
          en: Copies a trait, spell or technique of the Screen.

  - key: fantasma
    folder: litura
    origin: litura
    grade: 1
    guard: 12
    danger: 3
    defense: 1
    resistances: [kinetic, void, energy]
    name:
      pt: Fantasma
      en: Ghost
    interactionsPerTurn:
      pt: Uma Ação e uma Manobra durante seu turno.
      en: One Action and one Maneuver during its turn.
    special:
      pt: >-
        Um fantasma tem resistência a qualquer dano. Caso seu nome real seja evocado em voz alta ao custo de uma manobra,
        essa resistência é desativada até o final do próximo turno de quem evocou o nome.
      en: >-
        A ghost has Resistance to all damage. If its real name is called aloud at the cost of a maneuver,
        that Resistance is deactivated until the end of the next turn of whoever called the name.
    power:
      pt: >-
        Um fantasma se apega ao mundo a partir de suas memórias remanescentes. Sempre que for derrotado, ele se formará
        novamente em questão de pouco tempo a não ser que seja exorcizado.
      en: >-
        A ghost clings to the world through its remaining memories. Whenever it is defeated, it will form
        again in a short time unless it is exorcised.
    weakness:
      pt: Um fantasma pode ser exorcizado a partir de um ritual envolvendo seus restos mortais ou itens importantes para ele em vida.
      en: A ghost can be exorcised through a ritual involving its mortal remains or items that were important to it in life.
    interactions:
      - key: possessao-momentanea
        kind: action
        attack: safo
        range: short
        cost: { value: 1, resource: danger }
        name:
          pt: Possessão Momentânea
          en: Momentary Possession
        description:
          pt: O alvo escolhe entre consumir SAFO para resistir ou realizar um ataque contra outro alvo em cena à escolha do fantasma.
          en: The target chooses between spending SAVVY to resist or making an attack against another target in the scene of the ghost's choice.
      - key: toque-funebre
        kind: action
        attack: brabo
        range: short
        damage: "3 + @danger"
        damageType: void
        name:
          pt: Toque Fúnebre
          en: Funereal Touch
        description:
          pt: >-
            Dano: 3 + PERIGO atual de dano vazio, negado por BRABO. O alvo perde 1 de Defesa caso tenha apenas um Acerto
            ou menos ao defender-se. Recupera 1 de PERIGO caso provoque dano à Guarda.
          en: >-
            Damage: 3 + current DANGER void damage, negated by FIERCE. The target loses 1 Defense if they have only one Hit
            or fewer when defending. Recovers 1 DANGER if it deals damage to Guard.
      - key: desmaterializar
        kind: maneuver
        name:
          pt: Desmaterializar
          en: Dematerialize
        description:
          pt: >-
            O fantasma some momentaneamente da cena, desmaterializando sua forma espectral. Enquanto desmaterializado, o
            fantasma não poderá realizar nenhum tipo de ataque. Ele pode ser encontrado por um uso da manobra Perceber,
            porém só poderá ser alvo de danos do tipo energético até que seja materializado novamente.
          en: >-
            The ghost momentarily vanishes from the scene, dematerializing its spectral form. While dematerialized, the
            ghost cannot make any kind of attack. It can be found by a use of the Perceive maneuver,
            but it can only be targeted by energy damage until it is materialized again.
      - key: materializar
        kind: maneuver
        name:
          pt: Materializar
          en: Materialize
        description:
          pt: >-
            O fantasma materializa-se novamente atrás de um alvo à sua escolha na cena. O próximo ataque do fantasma
            contra o alvo neste mesmo turno causa -1d ao teste de defesa.
          en: >-
            The ghost materializes again behind a target of its choice in the scene. The ghost's next attack
            against that target in this same turn imposes -1d on the defense roll.

  - key: catalisador
    folder: litura
    origin: litura
    grade: 1
    guard: 12
    danger: 1
    defense: 3
    brabo: 1
    name:
      pt: Catalisador
      en: Catalyst
    interactionsPerTurn:
      pt: Uma Ação ao final do turno de seu aliado aderido.
      en: One Action at the end of the turn of its attached ally.
    special:
      pt: >-
        Um catalisador é uma forma de espírito simbiótico cristalizado, que se adere a um aliado e amplifica seus poderes.
        Sempre que o alvo mover-se, o catalisador move-se junto. Some o PERIGO do catalisador ao dano de todo ataque do
        alvo aliado.
      en: >-
        A catalyst is a form of crystallized symbiotic spirit that attaches to an ally and amplifies their powers.
        Whenever the target moves, the catalyst moves along with it. Add the catalyst's DANGER to the damage of every attack
        by the allied target.
    power:
      pt: >-
        Um catalisador é como uma rêmora em um tubarão. Eles são alvos fáceis quando sós, porém junto de um bom aliado, o
        transformarão em uma ameaça formidável. Caso o aliado aderido seja derrotado, o catalisador desaparecerá até
        encontrar outro aliado para se nutrir.
      en: >-
        A catalyst is like a remora on a shark. They are easy targets when alone, but alongside a good ally, they
        will turn it into a formidable threat. If the attached ally is defeated, the catalyst will disappear until
        it finds another ally to feed on.
    weakness:
      pt: >-
        O catalisador não possui ataques ou qualquer outro tipo de ação que ameace outros seres, podendo apenas se nutrir
        de seu aliado aderido.
      en: >-
        The catalyst has no attacks or any other kind of action that threatens other beings, and can only feed
        on its attached ally.
    interactions:
      - key: catalisar
        kind: action
        range: short
        cost: { value: 2, resource: weave }
        name:
          pt: Catalisar
          en: Catalyze
        description:
          pt: O aliado aderido ao catalisador recebe uma ação imediatamente, que pode ser utilizada para SUPERAR.
          en: The ally attached to the catalyst immediately receives an action, which can be used to OVERCOME.
      - key: prover
        kind: action
        range: short
        cost: { value: 1, resource: danger }
        name:
          pt: Prover
          en: Provide
        description:
          pt: O catalisador consome 1 de PERIGO para que o seu alvo aliado recupere 1 de BRABO.
          en: The catalyst spends 1 DANGER so that its allied target recovers 1 FIERCE.
      - key: aceleracao
        kind: action
        range: short
        name:
          pt: Aceleração
          en: Acceleration
        description:
          pt: O aliado aderido ao catalisador recebe uma manobra imediatamente, que pode ser usada para Levantar a Guarda.
          en: The ally attached to the catalyst immediately receives a maneuver, which can be used to Raise Guard.

  - key: besta-mitica
    folder: litura
    origin: litura
    grade: 2
    guard: 11
    danger: 3
    defense: 4
    brabo: 2
    resistances: [energy]
    name:
      pt: Besta Mítica
      en: Mythic Beast
    interactionsPerTurn:
      pt: Duas ações e uma Manobra durante seu turno.
      en: Two actions and one Maneuver during its turn.
    tactics:
      pt: "Manobras favoritas: Mover-se, Levantar a Guarda. Reação disponível: contra-ataque, bloquear."
      en: "Favorite maneuvers: Move, Raise Guard. Available reaction: counterattack, block."
    power:
      pt: >-
        Sua força é tamanha, que ao demonstrá-la irá automaticamente desmaiar qualquer criatura mundana. Qualquer outra
        criatura de grau 1 fica amedrontada, impedida de realizar qualquer manobra a não ser que consiga superar este
        efeito.
      en: >-
        Its strength is so great that displaying it will automatically knock out any mundane creature. Any other
        grade 1 creature becomes frightened, barred from performing any maneuver unless it manages to overcome this
        effect.
    weakness:
      pt: Uma antiga ferida pode ser explorada, reaberta, contanto que saibam a história por trás do que a feriu em primeiro lugar.
      en: An old wound can be exploited, reopened, as long as they know the story behind what injured it in the first place.
    interactions:
      - key: esmagar
        kind: action
        attack: brabo
        range: short
        cost: { value: 1, resource: danger }
        damage: "2d6 + @danger"
        damageType: kinetic
        name:
          pt: Esmagar
          en: Crush
        description:
          pt: >-
            Dano: 2d6 + PERIGO atual de dano cinético em um alvo, ou 2d6 de dano cinético a todos dentro do alcance,
            negado por LIGEIRO. Alvos desse ataque perdem 1 de Defesa. Um alvo é desequilibrado ou arremessado para longe.
          en: >-
            Damage: 2d6 + current DANGER kinetic damage to one target, or 2d6 kinetic damage to everyone within range,
            negated by SWIFT. Targets of this attack lose 1 Defense. One target is knocked off-balance or hurled away.
      - key: recuperar-se
        kind: action
        name:
          pt: Recuperar-se
          en: Recover
        description:
          pt: Teste PERIGO. Recupera 1 PERIGO para cada Acerto.
          en: Test DANGER. Recovers 1 DANGER for each Hit.
      - key: destruicao
        kind: action
        attack: safo
        range: wide
        cost: { value: 1, resource: danger }
        name:
          pt: Destruição
          en: Destruction
        description:
          pt: Cada alvo escolhe entre gastar 1 LIGEIRO ou sofrer 1d6 de dano energético AD.
          en: Each target chooses between spending 1 SWIFT or suffering 1d6 energy PD damage.

  - key: morto-de-pe
    folder: oblivo
    origin: oblivo
    grade: 1
    guard: 12
    danger: 1
    defense: 3
    brabo: 3
    vulnerabilities: [energy]
    name:
      pt: Morto de Pé
      en: Walking Dead
    interactionsPerTurn:
      pt: Uma Ação ou Manobra durante seu turno.
      en: One Action or Maneuver during its turn.
    tactics:
      pt: "Reação disponível: contra-ataque, Perder Pedaço."
      en: "Available reaction: counterattack, Lose a Piece."
    power:
      pt: Um morto de pé sozinho não é muito perigoso para um desperto, porém ele pode criar outros mortos de pé ao matar uma vítima.
      en: A lone walking dead is not very dangerous to an Awakened, but it can create other walking dead by killing a victim.
    weakness:
      pt: Sua lentidão é sua maior fraqueza.
      en: Its slowness is its greatest weakness.
    interactions:
      - key: agarrar
        kind: action
        attack: ligeiro
        range: short
        cost: { value: 1, resource: danger }
        damage: "1d6"
        damageType: kinetic
        name:
          pt: Agarrar
          en: Grab
        description:
          pt: >-
            Dano: 1d6 de dano cinético, negado por LIGEIRO. O alvo sofre 1 de dano AD e fica impedido de mover-se caso
            tenha apenas um Acerto ou menos ao defender-se.
          en: >-
            Damage: 1d6 kinetic damage, negated by SWIFT. The target suffers 1 PD damage and is impeded from moving if
            they have only one Hit or fewer when defending.
      - key: morder
        kind: action
        attack: brabo
        range: short
        damage: "2 + @danger"
        damageType: kinetic
        name:
          pt: Morder
          en: Bite
        description:
          pt: >-
            Um alvo agarrado. Dano: 2 + PERIGO atual de dano cinético, negado por BRABO. O alvo perde 1 de Defesa caso
            tenha apenas um Acerto ou menos ao defender-se. Recupere pontos de Guarda equivalentes à Memória faltando do
            alvo.
          en: >-
            A grabbed target. Damage: 2 + current DANGER kinetic damage, negated by FIERCE. The target loses 1 Defense if
            they have only one Hit or fewer when defending. Recover Guard points equal to the target's missing Memory.
      - key: reerguer-se
        kind: action
        cost: { value: 1, resource: brabo }
        name:
          pt: Reerguer-se
          en: Rise Again
        description:
          pt: >-
            Custa 1 de BRABO, TRAMA ou PERIGO. O morto se levanta após ser derrotado. Não poderá usar caso esteja impedido
            de juntar suas partes.
          en: >-
            Costs 1 FIERCE, WEAVE or DANGER. The dead rises after being defeated. Cannot be used if it is prevented
            from gathering its parts.
      - key: perder-pedaco
        kind: reaction
        cost: { value: 1, resource: danger }
        name:
          pt: Perder Pedaço
          en: Lose a Piece
        description:
          pt: Consome 1 de PERIGO para evitar completamente um dano recebido, em troca de perder um pedaço de si.
          en: Spends 1 DANGER to completely avoid damage received, in exchange for losing a piece of itself.

  - key: mascara-maldita
    folder: oblivo
    origin: oblivo
    grade: 1
    guard: 12
    danger: 1
    defense: 3
    brabo: 3
    resistances: [kinetic, void, energy]
    name:
      pt: Máscara Maldita
      en: Cursed Mask
    interactionsPerTurn:
      pt: Uma Ação ou Manobra durante seu turno.
      en: One Action or Maneuver during its turn.
    special:
      pt: >-
        Uma máscara flutuante bizarra com tentáculos de energia sombria. Resistência a dano energético, cinético e vazio.
        Sempre que gastar Perigo perde uma dessas resistências. Ela pode usar o corpo de suas vítimas, obtendo um bônus
        para sua defesa e saúde igual ao do mesmo, e usando sua locomoção.
      en: >-
        A bizarre floating mask with tentacles of dark energy. Resistance to energy, kinetic and void damage.
        Whenever it spends Danger, it loses one of these Resistances. It can use the bodies of its victims, gaining a bonus
        to its defense and health equal to theirs, and using their locomotion.
    tactics:
      pt: "Manobras favoritas: Mau Olhado, Ligar Almas, Levantar a Guarda. Reação disponível: contra-ataque."
      en: "Favorite maneuvers: Evil Eye, Bind Souls, Raise Guard. Available reaction: counterattack."
    power:
      pt: >-
        A Máscara Maldita é o eco de um desperto que esqueceu a própria história, e, portanto, se alimenta das histórias
        de suas vítimas. Caso a Máscara derrote um Desperto, ela o possuirá, fazendo-o vesti-la e usando-o para cumprir
        seus objetivos.
      en: >-
        The Cursed Mask is the echo of an Awakened who forgot their own story, and therefore feeds on the stories
        of its victims. If the Mask defeats an Awakened, it will possess them, making them wear it and using them to fulfill
        its goals.
    weakness:
      pt: A máscara não consegue sustentar-se sozinha, necessitando de um receptáculo para mover-se.
