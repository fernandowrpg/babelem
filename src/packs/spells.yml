      pt: >-
        Traga alguém de volta dos mortos, desde que você tenha conseguido presenciar seus momentos finais antes de morrer,
        ou tenha acesso a esses momentos de algum outro modo. Ele voltará próximo a você, vestindo o que você lembra de
        vê-lo vestindo por último, e tanto você quanto o alvo da ressurreição perderão uma letra de seu nome para o
