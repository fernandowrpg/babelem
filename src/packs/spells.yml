      en: >-
        Raise a barrier between the material world and the suprareal to protect the surroundings, trapping allies and
        opponents. Inside, an alternate version of reality is shown, beneath a dark, starless sky. From inside or outside,
        the spell gains BARRIER equal to the amount of Aura used to cast the spell, and removing it ends the spell.
        Otherwise, the spell ends when the scene ends.
    extraRelease:
      pt: >-
        +1 AURA por oponente. Defina uma regra junto à Tecelã, que faça sentido para o seu conceito de personagem.
        Enquanto respeitar a condição estabelecida, seus feitiços e técnicas não consomem AURA, e qualquer um infringindo
        essa regra receberá -1d em todo teste até que o Território seja desfeito. O Território é desfeito automaticamente
        caso a regra não seja seguida pelo conjurador ou caso o conjurador chegue a 0 de Guarda.
      en: >-
        +1 AURA per opponent. Define a rule together with the Weaver that makes sense for your character concept. As long
        as the established condition is respected, your spells and techniques do not consume AURA, and anyone breaking
        this rule will receive -1d on every Test until the Territory is undone. The Territory is automatically undone if
        the rule is not followed by the caster or if the caster reaches 0 Guard.

