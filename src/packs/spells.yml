      pt: +1 LIGEIRO para que alvos aliados possam cantar como uma reação em vez de uma ação.
      en: +1 SWIFT so that allied targets can sing as a reaction instead of an action.

  - key: memento-mori
    itemType: spell
    plane: litura
    d66: "5/6"
    activation: action
    cost: { value: 3, resource: aura }
    extraCost: { value: 1, resource: brabo }
