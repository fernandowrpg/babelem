        chosen target.

  - key: territorio
    itemType: spell
    plane: litura
    d66: "6/5"
    activation: action
    cost: { value: 1, resource: aura }
    extraCost: { value: 1, resource: aura }
    name:
      pt: Território
      en: Territory
    description:
      pt: >-
        Erga uma barreira entre o mundo material e o suprarreal para proteger as redondezas, prendendo aliados e
        oponentes. Por dentro, uma versão alternativa da realidade é mostrada, por baixo de um céu escuro e sem estrelas.
