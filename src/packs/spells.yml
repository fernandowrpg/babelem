        access to those moments in some other way. They will return near you, wearing what you remember seeing them wear
        last, and both you and the target of the resurrection will lose a letter of your names to the Oblivo. Small
        differing details are to be expected.
    extraRelease:
      pt: +1 BRABO para lançar como uma ação livre.
      en: +1 FIERCE to cast as a free action.

